## Build Docker Image
name: Deploy Scribble_hub frontend
on:
  push:
    branches: [staging]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ##Docker build then push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.BACKEND_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.WS_URL }}
            NEXT_PUBLIC_FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            LLM_URL=${{ secrets.LLM_URL }}
            LLM_TOKEN=${{ secrets.LLM_TOKEN }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
          push: true
          tags: dipesh2009/scribble_hub-frontend:${{ github.sha }}
      - run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ${{ secrets.EC2_HOST }} -t "
            docker stop scribble_frontend 2>/dev/null || true
            docker rm scribble_frontend 2>/dev/null || true
            docker run -d --name scribble_frontend -p 3003:3000 \
              -e NEXT_PUBLIC_BACKEND_URL='${{ secrets.BACKEND_URL }}' \
              -e NEXT_PUBLIC_FRONTEND_URL='${{ secrets.FRONTEND_URL }}' \
              -e NEXT_PUBLIC_WS_URL='${{ secrets.WS_URL }}' \
              -e LLM_URL='${{ secrets.LLM_URL }}' \
              -e LLM_TOKEN='${{ secrets.LLM_TOKEN }}' \
              -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              dipesh2009/scribble_hub-frontend:${{ github.sha }}
          "
